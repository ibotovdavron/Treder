<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treder — Jonli bozor grafiklari</title>
  <meta name="description" content="BTCUSD, XAUUSD, EURUSD va boshqa valyutalarning onlayn grafiklari va narxlari.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▲</span>
      <span class="brand-name">Treder</span>
    </div>
    <div class="topbar-actions">
      <span class="live"><span class="dot"></span> Jonli</span>
      <button id="themeToggle" class="btn-ghost" type="button" aria-label="Mavzuni almashtirish">☀︎</button>
    </div>
  </header>

  <!-- Yuguruvchi narxlar lentasi -->
  <div id="tickerTape" class="ticker"></div>

  <main class="container">
    <section class="toolbar">
      <div id="symbolTabs" class="tabs" role="tablist"></div>
      <div class="intervals" id="intervals" role="group" aria-label="Vaqt oraligʻi"></div>
    </section>

    <section class="grid">
      <div class="card chart-card">
        <div class="card-head">
          <h1 id="chartTitle">BTC / USD</h1>
          <span id="chartSub" class="muted">Bitcoin</span>
        </div>
        <div id="mainChart" class="chart"></div>
      </div>

      <aside class="side">
        <div class="card">
          <div class="card-head"><h2>Texnik tahlil</h2></div>
          <div id="techAnalysis" class="widget-ta"></div>
        </div>
      </aside>
    </section>

    <section class="grid-2">
      <div class="card">
        <div class="card-head"><h2>Bozor sharhi</h2></div>
        <div id="marketOverview" class="widget-mo"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Iqtisodiy kalendar</h2></div>
        <div id="calendar" class="widget-mo"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Maʼlumotlar <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a> tomonidan taqdim etiladi. Bu investitsiya maslahati emas.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
